server:
  port: 8091
  error:
    include-message: always

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/hrgenius_auth
    username: root
    password: ${DB_PASSWORD:HrApp@12345}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:Redis@12345}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}
  access-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:3880}
  refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}

app:
  admin:
    username: admin
    email: admin@hrgenius.com
    password: ${ADMIN_PASSWORD:Admin@12345}

internal:
  api-key: ${INTERNAL_API_KEY:HRGeniusSecretKey2026}